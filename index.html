<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Châlons Quest - En Ligne 1v1</title>
    <!-- Inclusion de PeerJS pour le réseau Peer-to-Peer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.85);
            --primary: #00f2fe;
            --accent: #ff007f;
            --success: #00ff87;
            --error: #ff3860;
            --text: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.15), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.15), transparent 30%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .score-board {
            display: flex;
            gap: 15px;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.4);

            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            min-width: 110px;
        }

        .score-card .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .score-card .value {

            font-weight: bold;
            color: var(--primary);
        }

        .menu-box {

            flex-direction: column;

        }

        .input-group {

    { type: 'text', cat: '🟢 Facile', q: 'Peut-on trouver une caserne de pompiers à Châlons ?', answer: ['Oui'] },
    { type: 'qcm', cat: '🟢 Facile', q: 'Peut-on trouver une police municipale à Châlons ?', options: ['Oui', 'Non', 'Seulement la nuit', 'Seulement en été'], answer: 'Oui' },
    { type: 'text', cat: '🟢 Facile', q: 'Quel quartier est connu sous le nom de Verbeau ?', answer: ['Le Verbeau', 'Verbeau'] },

    { type: 'text', cat: '🟢 Facile', q: 'Où attend-on généralement un bus ?', answer: ['A un arret de bus', 'Arret de bus', 'Arret'] },

    { type: 'text', cat: '🟢 Facile', q: 'Quel type de voie permet de sortir rapidement de la ville en voiture ?', answer: ['Route', 'Autoroute', 'Axe routier'] },
    { type: 'qcm', cat: '🟢 Facile', q: 'Châlons est-elle une ville avec beaucoup de zones vertes ?', options: ['Oui', 'Non', 'Seulement en périphérie', 'Seulement autour de la gare'], answer: 'Oui' },
    { type: 'text', cat: '🟢 Facile', q: 'Quel lieu est idéal pour faire une promenade tranquille : le Grand Jard ou une zone industrielle ?', answer: ['Le Grand Jard', 'Grand Jard'] },
    
    // Suite raccourcie pour l'exemple mais contient toute la logique globale
    { type: 'qcm', cat: '🔴 Difficile', q: 'Quel grand axe relie Châlons-en-Champagne à Reims ?', options: ['D944', 'D977', 'D3', 'N4'], answer: 'D944' },
    { type: 'free', cat: '💀 ULTIME', q: 'QUESTION FINALE : Donne un lieu connu, un bâtiment, un espace vert, un moyen de transport et un quartier de Châlons.', keywords: ['gare', 'centre', 'jard', 'bus', 'train', 'cathedrale', 'comete', 'verbeau', 'mairie', 'prefecture', 'marne'] }
];

// --- VARIABLES RÉSEAU ET JEU ---
let peer = null;
let conn = null;
let isHost = false;

let myPseudo = "";
let opponentPseudo = "";

let myScore = 0;
let oppScore = 0;

let currentQuestionIdx = 0;
let currentTurnPseudo = ""; // Pseudo du joueur dont c'est le tour

// Distances Levenshtein pour tolérance fautes d'orthographe
function levenshteinDistance(str1, str2) {
    const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
    for (let i = 0; i <= str1.length; i++) track[0][i] = i;
    for (let j = 0; j <= str2.length; j++) track[j][0] = j;
    for (let j = 1; j <= str2.length; j++) {
        for (let i = 1; i <= str1.length; i++) {
            const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
            track[j][i] = Math.min(track[j][i - 1] + 1, track[j - 1][i] + 1, track[j - 1][i - 1] + indicator);
        }
    }
    return track[str2.length][str1.length];
}

function normalizeText(text) {
    return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").trim();
}

function isTextCorrect(userInput, validAnswers) {
    const cleanInput = normalizeText(userInput);
    if (!cleanInput) return false;
    for (let ans of validAnswers) {
        const cleanAns = normalizeText(ans);
        const dist = levenshteinDistance(cleanInput, cleanAns);
        let allowedErrors = cleanAns.length > 8 ? 2 : 1;
        if (dist <= allowedErrors || cleanInput.includes(cleanAns) || cleanAns.includes(cleanInput)) return true;
    }
    return false;
}

// --- LOGIQUE MULTIJOUEUR EN LIGNE (PEERJS) ---

function showStatus(msg) {
    const statusEl = document.getElementById('status-msg');
    statusEl.style.display = 'block';
    statusEl.innerText = msg;
}

function cleanId(pseudo) {
    return 'chalons-quest-' + normalizeText(pseudo);
}

function showJoinInput() {
    document.getElementById('join-box').style.display = 'flex';
}

// 1. HÔTE : Crée la partie
function hostGame() {
    myPseudo = document.getElementById('my-pseudo').value.trim();
    if (!myPseudo) return alert("Rentre ton pseudo d'abord !");

    isHost = true;
    const peerId = cleanId(myPseudo);

    showStatus("Création du salon en cours...");
    peer = new Peer(peerId);

    peer.on('open', () => {
        showStatus(`Salon créé ! Dis à ton pote d'entrer exactement ton pseudo : "${myPseudo}"`);
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            alert("Ce pseudo est déjà utilisé actuellement par quelqu'un d'autre !");
        } else {
            alert("Erreur de connexion : " + err.type);
        }
    });
}

// 2. CLIENT : Rejoindre la partie
function joinGame() {
    myPseudo = document.getElementById('my-pseudo').value.trim();
    const targetPseudo = document.getElementById('target-pseudo').value.trim();

    if (!myPseudo || !targetPseudo) return alert("Remplis ton pseudo ET celui de ton pote !");

    isHost = false;
    peer = new Peer();

    peer.on('open', () => {
        showStatus("Connexion chez " + targetPseudo + "...");
        const targetPeerId = cleanId(targetPseudo);
        conn = peer.connect(targetPeerId);
        setupConnection();
    });

    peer.on('error', () => {
        alert("Impossible de trouver le joueur " + targetPseudo + ". Vérifie qu'il a bien cliqué sur Héberger !");
    });
}

// 3. SYNCHRONISATION DES DEUX JOUEURS
function setupConnection() {
    conn.on('open', () => {
        // Envoie de son pseudo à l'autre
        conn.send({ type: 'HANDSHAKE', pseudo: myPseudo });
    });

    conn.on('data', (data) => {
        handleNetworkData(data);
    });
}

function handleNetworkData(data) {
    if (data.type === 'HANDSHAKE') {
        opponentPseudo = data.pseudo;
        document.getElementById('p1-name-display').innerText = myPseudo;
        document.getElementById('p2-name-display').innerText = opponentPseudo;

        if (isHost) {
            currentTurnPseudo = myPseudo; // L'hôte commence
            broadcastState();
        }
        startQuizUI();
    } 
    else if (data.type === 'STATE_UPDATE') {
        // Mise à jour synchro envoyée par l'hôte
        currentQuestionIdx = data.qIdx;
        currentTurnPseudo = data.turnPseudo;
        
        if (isHost) {
            myScore = data.scores[myPseudo] || 0;
            oppScore = data.scores[opponentPseudo] || 0;
        } else {
            myScore = data.scores[myPseudo] || 0;
            oppScore = data.scores[opponentPseudo] || 0;
        }

        updateUI();
    }
    else if (data.type === 'SUBMIT_ANSWER') {
        // L'hôte reçoit une réponse de l'invité
        if (isHost) {
            processAnswerLogic(data.isCorrect, data.ansText, opponentPseudo);
        }
    }
}

function startQuizUI() {
    document.getElementById('connection-menu').style.display = 'none';
    document.getElementById('quiz-game').style.display = 'block';
    updateUI();
}

function broadcastState() {
    if (!isHost) return;
    
    const scoresData = {};
    scoresData[myPseudo] = myScore;
    scoresData[opponentPseudo] = oppScore;

    const state = {
        type: 'STATE_UPDATE',
        qIdx: currentQuestionIdx,
        turnPseudo: currentTurnPseudo,
        scores: scoresData
    };

    updateUI();
    if (conn) conn.send(state);
}

// --- AFFICHAGE DE LA QUESTION ---

function updateUI() {
    document.getElementById('my-score').innerText = myScore;
    document.getElementById('opp-score').innerText = oppScore;

    if (currentQuestionIdx >= questionsData.length) {
        showEndGame();
        return;
    }

    const qData = questionsData[currentQuestionIdx];
    document.getElementById('q-category').innerText = qData.cat;
    document.getElementById('q-text').innerText = qData.q;

    const progressPct = (currentQuestionIdx / questionsData.length) * 100;
    document.getElementById('progress').style.width = progressPct + '%';

    const turnEl = document.getElementById('turn-indicator');
    const isMyTurn = (currentTurnPseudo === myPseudo);

    turnEl.innerText = isMyTurn ? "👉 C'est TON TOUR de jouer !" : `⏳ Tour de ${currentTurnPseudo}...`;
    turnEl.style.borderColor = isMyTurn ? 'var(--primary)' : 'var(--accent)';
    turnEl.style.color = isMyTurn ? 'var(--primary)' : 'var(--accent)';

    const area = document.getElementById('interaction-area');
    area.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';

    if (qData.type === 'qcm') {
        const grid = document.createElement('div');
        grid.className = 'options-grid';
        qData.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.disabled = !isMyTurn;
            btn.onclick = () => submitPlayerAnswer(opt === qData.answer, qData.answer);
            grid.appendChild(btn);
        });
        area.appendChild(grid);
    } else {
        const group = document.createElement('div');
        group.className = 'input-group';
        group.innerHTML = `
            <input type="text" id="text-answer" class="input-field" placeholder="Ta réponse..." ${!isMyTurn ? 'disabled' : ''}>
            <button class="btn" onclick="submitTextAnswer()" ${!isMyTurn ? 'disabled' : ''}>Valider</button>
        `;
        area.appendChild(group);
    }
}

function submitTextAnswer() {
    const val = document.getElementById('text-answer').value;
    const qData = questionsData[currentQuestionIdx];

    if (qData.type === 'text') {
        const correct = isTextCorrect(val, qData.answer);
        submitPlayerAnswer(correct, qData.answer[0]);
    } else if (qData.type === 'free') {
        const clean = normalizeText(val);
        let matches = 0;
        qData.keywords.forEach(kw => { if (clean.includes(kw)) matches++; });
        submitPlayerAnswer(matches >= 2, "Plusieurs lieux emblématiques");
    }
}

function submitPlayerAnswer(isCorrect, ansText) {
    if (isHost) {
        processAnswerLogic(isCorrect, ansText, myPseudo);
    } else {
        conn.send({ type: 'SUBMIT_ANSWER', isCorrect: isCorrect, ansText: ansText });
    }
}

function processAnswerLogic(isCorrect, ansText, playerWhoAnswered) {
    const feedbackEl = document.getElementById('feedback');
    feedbackEl.style.display = 'block';

    if (isCorrect) {
        feedbackEl.className = 'feedback correct';
        feedbackEl.innerText = `✨ ${playerWhoAnswered} a trouvé la bonne réponse ! (+10 pts)`;
        if (playerWhoAnswered === myPseudo) myScore += 10;
        else oppScore += 10;
    } else {
        feedbackEl.className = 'feedback wrong';
        feedbackEl.innerText = `❌ Mauvaise réponse de ${playerWhoAnswered} ! (Attendu : ${ansText})`;
    }

    // Changement de tour et question suivante
    setTimeout(() => {
        currentQuestionIdx++;
        currentTurnPseudo = (currentTurnPseudo === myPseudo) ? opponentPseudo : myPseudo;
        broadcastState();
    }, 2000);
}

function showEndGame() {
    document.getElementById('quiz-game').style.display = 'none';
    const endEl = document.getElementById('end-screen');
    endEl.style.display = 'block';

    const details = document.getElementById('end-details');
    if (myScore > oppScore) {
        document.getElementById('end-title').innerText = "🏆 TU AS GAGNÉ !";
    } else if (oppScore > myScore) {
        document.getElementById('end-title').innerText = "💀 TU AS PERDU !";
    } else {
        document.getElementById('end-title').innerText = "🤝 ÉGALITÉ !";
    }
    details.innerText = `Score Final :\n ${myPseudo} : ${myScore} pts | ${opponentPseudo} : ${oppScore} pts`;
}
</script>
